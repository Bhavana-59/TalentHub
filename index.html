<title>TalentHub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: editorial split-screen landing; the app is a navy rail beside an off-white canvas, with cards only where content needs grouping. */

  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r: 16px; --r-sm: 10px; --side-w: 256px; --gutter: clamp(16px, 4vw, 56px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070A20; --surface: #0E1336; --surface-2: #151B48; --ink: #F1EFE8; --muted: #A3A9CE; --line: #212859; --line-strong: #323B78;
  --violet: #A68CFF; --violet-soft: #231B5E; --btn: #6D3FF5; --btn-hover: #7E55FF; --lime: #CDF84A; --lime-ink: #0B1030; --lime-dk: #CDF84A;
  --good: #3FDC9A; --warn: #F2B445; --bad: #FF7B8C; --bad-btn: #D2465B; --info: #57C8EA;
  --side: #050719; --side-line: #1A2050; --shadow-sm: none; --shadow: 0 16px 40px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #070A20; --surface: #0E1336; --surface-2: #151B48; --ink: #F1EFE8; --muted: #A3A9CE; --line: #212859; --line-strong: #323B78;
  --violet: #A68CFF; --violet-soft: #231B5E; --btn: #6D3FF5; --btn-hover: #7E55FF; --lime: #CDF84A; --lime-ink: #0B1030; --lime-dk: #CDF84A;
  --good: #3FDC9A; --warn: #F2B445; --bad: #FF7B8C; --bad-btn: #D2465B; --info: #57C8EA;
  --side: #050719; --side-line: #1A2050; --shadow-sm: none; --shadow: 0 16px 40px rgba(0,0,0,.45); color-scheme: dark; }

/* Brand and buttons */

.chip-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.chip-info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.chip-violet { color: var(--violet); background: var(--violet-soft); border-color: transparent; } .chip-lime { background: var(--lime); color: var(--lime-ink); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .chips-lg { gap: 8px; margin-bottom: 14px; }
.cologo { display: inline-grid; place-items: center; border-radius: 12px; color: #fff; font-family: var(--font-display); font-weight: 800; flex: none; letter-spacing: -.02em; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; background: var(--violet-soft); color: var(--violet); font-weight: 700; flex: none; }

/* Cards and common blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow-sm); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.stack { display: grid; gap: 18px; align-content: start; min-width: 0; } .stack-sm { display: grid; gap: 12px; } .stack > h2.h-sm { font-size: 1.05rem; }
.page { display: grid; gap: 22px; max-width: 1240px; margin-inline: auto; width: 100%; min-width: 0; }

.pagehead-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.empty { text-align: center; display: grid; justify-items: center; gap: 8px; padding: 36px 16px; } .empty p { color: var(--muted); max-width: 44ch; margin-bottom: 8px; }
.empty-ic { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: var(--violet-soft); color: var(--violet); }

.notice-info { background: color-mix(in srgb, var(--violet) 9%, var(--surface)); border-color: color-mix(in srgb, var(--violet) 25%, transparent); }
.notice-bad { background: color-mix(in srgb, var(--bad) 9%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 30%, transparent); color: var(--ink); } .notice-bad .ic { color: var(--bad); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; } .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } .grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; } .grid-6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-profile { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; } .grid-detail { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.sticky-col { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); }
.stat { text-align: left; display: grid; gap: 4px; transition: border-color .15s, transform .15s; } .stat:hover { border-color: var(--violet); transform: translateY(-2px); }
.stat b, .metric b { font-family: var(--font-display); font-size: 2.1rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 8px; } .stat > span:last-child, .metric > span:last-child { color: var(--muted); font-size: 13.5px; }
.stat-ic { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--violet-soft); color: var(--violet); }
.metric { display: grid; gap: 4px; } .metric-rec .stat-ic { background: var(--lime); color: var(--lime-ink); } .metric b { font-size: 1.8rem; }
.rows { display: grid; gap: 4px; } .rows > li { padding: 12px 0; border-top: 1px solid var(--line); } .rows > li:first-child { border-top: 0; padding-top: 0; }
.row-job, .row-iv, .row-sugg { display: flex; gap: 12px; align-items: center; } .row-job .chips { margin-top: 6px; }
.row-log p { margin: 2px 0; } .row-log small { color: var(--muted); font-size: 12px; }
.datebox { display: grid; place-items: center; width: 46px; height: 50px; border-radius: 12px; background: var(--violet-soft); color: var(--violet); flex: none; line-height: 1.05; } .datebox b { font-family: var(--font-display); font-size: 1.2rem; } .datebox small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.activity { display: grid; gap: 14px; } .activity li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; } .act-dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
.profile-card { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; } .profile-card .btn { margin-top: 10px; }
.checklist { display: grid; gap: 12px; margin-top: 14px; } .auto-item { display: flex; align-items: center; gap: 10px; } .auto-item.done > span:nth-child(2) { color: var(--muted); text-decoration: line-through; } .auto-item .link { margin-left: auto; }
.todo { display: grid; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 13.5px; } .todo li { display: flex; align-items: center; gap: 8px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; } .meter span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--btn), var(--lime)); transition: width .4s; }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; } .ring svg { position: absolute; inset: 0; } .ring span { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.tablewrap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
.table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 14px; } .table th { text-align: left; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1.5px solid var(--line-strong); white-space: nowrap; }
.table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; } .table tbody tr:hover { background: color-mix(in srgb, var(--violet) 4%, transparent); }
.table small { display: block; color: var(--muted); font-size: 12.5px; } .table .num { font-variant-numeric: tabular-nums; } .table .actions { text-align: right; white-space: nowrap; } .table .actions > * { margin-left: 6px; } .table .nowrap { white-space: nowrap; }
.table.cmp th[scope=row] { color: var(--ink); font-family: var(--font-body); font-size: 13.5px; text-transform: none; letter-spacing: 0; } .table.cmp { min-width: 520px; } .table .dim { color: var(--muted); font-style: italic; }
.who { display: flex; align-items: center; gap: 10px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; } .pager > div { display: flex; align-items: center; gap: 8px; } .pager-n { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; padding: 4px; background: var(--surface-2); border-radius: 14px; width: fit-content; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; } .tab:hover { color: var(--ink); } .tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.tab-n { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--violet-soft); color: var(--violet); font-weight: 600; }
.bars { display: grid; gap: 10px; margin-top: 14px; } .bars li { display: grid; grid-template-columns: 130px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 13.5px; } .bar-track { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; } .bar-fill { display: block; height: 100%; border-radius: 99px; min-width: 3px; } .bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.funnel { display: grid; gap: 10px; margin-top: 14px; } .funnel li { display: grid; gap: 4px; } .funnel-bar { background: var(--btn); color: #fff; border-radius: 10px; padding: 8px 12px; min-width: 44px; transition: width .4s; } .funnel-bar b { font-family: var(--font-display); font-variant-numeric: tabular-nums; } .funnel-label { font-size: 13px; display: flex; gap: 8px; align-items: baseline; } .funnel-label small { color: var(--muted); }
.linechart { width: 100%; height: auto; margin-top: 8px; }
.stepper-wrap { margin-block: 14px 4px; } .stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; } .step { display: grid; gap: 6px; min-width: 0; }
.step-bar { height: 22px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: transparent; }
.step.done .step-bar { background: var(--btn); border-color: var(--btn); color: #fff; } .step.cur .step-bar { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); } .step.stop .step-bar { background: var(--bad-btn); border-color: var(--bad-btn); color: #fff; }
.step-lbl { font-size: 11.5px; line-height: 1.2; color: var(--muted); } .step.done .step-lbl, .step.cur .step-lbl, .step.stop .step-lbl { color: var(--ink); font-weight: 600; } .step-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

/* Forms */
.field { display: grid; gap: 6px; align-content: start; min-width: 0; } .field label, .field .lbl { font-weight: 600; font-size: 13.5px; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { width: 100%; min-height: 44px; padding: .55rem .8rem; border: 1.5px solid var(--line-strong); border-radius: 11px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
textarea { resize: vertical; line-height: 1.5; } input:focus, select:focus, textarea:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 25%, transparent); }
input[readonly] { background: var(--surface-2); color: var(--muted); } .has-err input, .has-err select, .has-err textarea { border-color: var(--bad); }
.hint { font-size: 12.5px; color: var(--muted); } .err { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--bad); font-weight: 500; } .err .ic { margin-top: 2px; }
.form-stack { display: grid; gap: 16px; } .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; } .span2 { grid-column: 1 / -1; }
.form-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-block: 8px 16px; } .form-row .field:not(.grow) { min-width: 160px; }
.check { display: inline-flex; gap: 10px; align-items: flex-start; position: relative; cursor: pointer; font-size: 14px; } .check input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.check-box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-strong); display: inline-grid; place-items: center; flex: none; margin-top: 1px; color: #fff; background: var(--surface); } .check-box svg { opacity: 0; }
.check input:checked + .check-box, .auto-item.done .check-box { background: var(--btn); border-color: var(--btn); } .check input:checked + .check-box svg, .auto-item.done .check-box svg { opacity: 1; } .check input:focus-visible + .check-box { outline: 3px solid var(--violet); outline-offset: 2px; }
.toggle { display: flex; gap: 12px; align-items: flex-start; position: relative; cursor: pointer; } .toggle input { position: absolute; opacity: 0; width: 44px; height: 26px; margin: 0; cursor: pointer; }
.toggle-track { width: 44px; height: 26px; border-radius: 99px; background: var(--line-strong); position: relative; flex: none; transition: background .15s; } .toggle-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle input:checked + .toggle-track { background: var(--btn); } .toggle input:checked + .toggle-track::after { transform: translateX(18px); } .toggle input:focus-visible + .toggle-track { outline: 3px solid var(--violet); outline-offset: 2px; }
.toggle-text { display: grid; gap: 2px; font-size: 14px; } .toggle-text small { color: var(--muted); font-size: 12.5px; }
